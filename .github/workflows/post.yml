name: Post daily reel

on:
  schedule:
    # 3 Reels pro Tag: 11:17, 15:17, 19:17 Wiener Winterzeit.
    # GitHub laesst geplante Laeufe manchmal ausfallen; die Zusatztermine sind
    # Ersatz und posten nur, wenn im aktuellen Slot noch nichts gepostet wurde.
    - cron: "17,47 10,14,18 * * *"
    - cron: "17 11,15,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur rendern, nichts veroeffentlichen"
        type: boolean
        default: false
      force:
        description: "Sofort posten, auch wenn gerade erst gepostet wurde"
        type: boolean
        default: false
      format:
        description: "Leer = laut data/formats.json, sonst quiz oder satisfying"
        type: string
        default: ""
      scene:
        description: "Nur fuer satisfying: pendulum, marbles, slice, stack (leer = automatisch)"
        type: string
        default: ""

permissions:
  contents: write

concurrency: post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get latest state
        run: git pull --ff-only origin "${GITHUB_REF_NAME}" || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        timeout-minutes: 5
        run: |
          # ffmpeg als statisches Binary von PyPI (apt-get hing am 2026-11-11 ueber 15 min)
          pip install -q -r requirements.txt imageio-ffmpeg
          mkdir -p "$HOME/bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Git identity
        run: |
          git config user.name "reelbot"
          git config user.email "reelbot@users.noreply.github.com"
      - name: Render and post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          FORMAT: ${{ inputs.format }}
          SCENE: ${{ inputs.scene }}
        run: python post.py
      - name: Update stats
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python stats.py
      - name: Save state
        if: always()
        run: |
          git add data/state.json 2>/dev/null || true
          git add data/stats.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update state and stats"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Keep rendered video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/reel.mp4
          retention-days: 7
          if-no-files-found: ignore
